[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-roof-scenario"
version = "0.2.0"
description = "Empirical Landsat-based modeling of green-roof cooling scenarios."
readme = "readme.md"
requires-python = ">=3.10"
authors = [
    { name = "Green Roof Scenario Maintainers" },
]
keywords = ["green roofs", "land surface temperature", "Landsat", "urban heat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "rasterstats>=0.19",
    "scikit-learn>=1.2",
    "shapely>=2.0",
]

[project.scripts]
green-roof-scenario = "green_roof_scenario.cli:main"
green-roof-fetch-osm = "green_roof_scenario.osm_green_roofs:main"
green-roof-params = "green_roof_scenario.green_roof_params:main"
green-roof-enrich-slopes = "green_roof_scenario.citygml_slopes:main"

[tool.setuptools.packages.find]
where = ["src"]
